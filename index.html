<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
银河堆栈大师 V5.0
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>
🌌 银河堆栈大师 V5.0
</h1>



<label class="upload">

选择银河照片

<input
id="photoInput"
type="file"
multiple
accept="image/*"
>

</label>



<div id="count">
已选择：0 张照片
</div>



<div id="preview">
</div>




<div id="progressBox">

<div id="progressBar">

</div>

</div>





<!-- ========= 调节面板 ========= -->

<div class="panel">


<h3>
🎨 图像调节
</h3>



<label>

曝光

<input
type="range"
id="exposure"
min="-2"
max="2"
step="0.1"
value="0"
>

</label>

<span id="expValue">
0.0 EV
</span>





<label>

对比度

<input
type="range"
id="contrast"
min="-100"
max="100"
step="1"
value="15"
>

</label>

<span id="contrastValue">
15
</span>






<label>

饱和度

<input
type="range"
id="saturation"
min="0"
max="200"
step="1"
value="120"
>

</label>

<span id="satValue">
120%
</span>







<label>

银河增强

<input
type="range"
id="galaxy"
min="0"
max="200"
step="1"
value="120"
>

</label>

<span id="galaxyValue">
120%
</span>



</div>





<button id="stackBtn">

✨ 开始银河堆栈

</button>





<p id="info">

等待照片...

</p>




<div id="result">

</div>





</div>




<script src="lib/raw_decoder.js"></script>

<script src="app.js"></script>



</body>

</html>
