<!DOCTYPE html>
<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
银河堆栈大师 V4
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="box">


<h1>
🌌 银河堆栈大师 V4
</h1>



<label class="upload">

选择银河照片

<input
id="photoInput"
type="file"
multiple
accept="
.dng,
.cr2,
.cr3,
.nef,
.arw,
.raf,
.jpg,
.jpeg,
.png
">

</label>



<div id="count">
已选择：0 张照片
</div>



<div id="preview">
</div>



<div id="progressBox">

<div id="progressBar">

</div>

</div>



<button id="stackBtn">

✨ 开始银河堆栈

</button>



<p id="info">

等待照片...

</p>



<div id="result">

</div>



</div>



<script src="lib/raw_decoder.js"></script>

<script src="app.js"></script>


</body>

</html>
